<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shradha विद्या Smart Study & Research Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl text-lg shadow-lg shadow-indigo-500/30">10X</div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white">shradha विद्या <span class="text-indigo-400 font-medium text-sm">Smart Study & Research Companion</span></h1>
                <p class="text-xs text-slate-400">Class 8 – PhD Academic Suite</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-xs bg-slate-800 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full font-medium">🔥 5Day Streak</span>
            <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full font-medium flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Connected
            </span>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="max-w-7xl mx-auto w-full px-6 mt-6">
        <div class="flex flex-wrap gap-2 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button onclick="switchMode('mode-exam')" id="tab-mode-exam" class="tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-slate-300 hover:text-white transition-all bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/30">
                <span>📚 Exam Generator</span>
            </button>
            <button onclick="switchMode('mode-qa')" id="tab-mode-qa" class="tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-slate-300 hover:text-white transition-all">
                <span>💡 Deep Q&A & Meaning</span>
            </button>
            <button onclick="switchMode('mode-doubt')" id="tab-mode-doubt" class="tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-slate-300 hover:text-white transition-all">
                <span>🧠 AI Doubt Solver</span>
            </button>
            <button onclick="switchMode('mode-summary')" id="tab-mode-summary" class="tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-slate-300 hover:text-white transition-all">
                <span>📄 Paper Summarizer</span>
            </button>
            <button onclick="switchMode('mode-citation')" id="tab-mode-citation" class="tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-slate-300 hover:text-white transition-all">
                <span>📌 Auto Citation</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full px-6 py-6 flex-1 flex flex-col space-y-6">

        <!-- MODE 1: Exam Generator -->
        <div id="mode-exam" class="mode-content space-y-6">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 backdrop-blur space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Class / Level</label>
                        <select id="examClass" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option>Class 9 - Mathematics</option>
                            <option>Class 10 - Science & Mathematics</option>
                            <option>Class 12 - (Board / Entrance Prep)</option>
                            <option>Undergraduate (B.Sc / B.Tech)</option>
                            <option>Postgraduate (M.Sc / Ph.D)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target Language</label>
                        <select id="examLang" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
                            <option value="Hindi">Hindi (हिन्दी)</option>
                            <option value="Bengali">Bengali (বাংলা)</option>
                            <option value="English">English</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Specific Topic / Chapter Name</label>
                    <input type="text" id="examTopic" placeholder="e.g. Number Systems, Real Numbers, Quantum Physics..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <button onclick="generateContent('exam')" class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-semibold py-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                    <span>🚀 Generate Exam Paper & Solutions</span>
                </button>
            </div>
        </div>

        <!-- MODE 2: Deep Q&A -->
        <div id="mode-qa" class="mode-content hidden space-y-6">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 backdrop-blur space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Class / Level</label>
                        <select id="qaClass" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option>Class 11</option><option>Class 12</option><option>Undergraduate</option><option>PhD Scholar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target Language</label>
                        <select id="qaLang" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option value="Hindi">Hindi</option><option value="Odia">Odia</option><option value="English">English</option><option value="Bengali">Bengali</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Detail Depth</label>
                        <select id="qaDepth" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option>Standard Academic Explanation</option><option>Deep Research Analysis</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Enter Question / Term</label>
                    <textarea id="qaPrompt" rows="3" placeholder="e.g. Quantum Entanglement or complex mathematical proof..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <button onclick="generateContent('qa')" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold py-4 rounded-xl shadow-lg transition-all">
                    <span>📖 Get Full Detailed Explanation & Meaning</span>
                </button>
            </div>
        </div>

        <!-- MODE 3: Doubt Solver -->
        <div id="mode-doubt" class="mode-content hidden space-y-6">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 backdrop-blur space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target Language</label>
                        <select id="doubtLang" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option value="Hinglish / Simple English">Hinglish / Simple English</option><option value="Odia">Odia</option><option value="Hindi">Hindi</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Explanation Style</label>
                        <select id="doubtStyle" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option>Step-by-Step with Real Life Example</option><option>Direct Formula & Short Trick</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Type or paste your doubt</label>
                    <textarea id="doubtPrompt" rows="3" placeholder="e.g. Newton's Third Law in real life..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200"></textarea>
                </div>
                <button onclick="generateContent('doubt')" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white font-semibold py-4 rounded-xl shadow-lg">
                    <span>⚡ Solve Doubt Instantly</span>
                </button>
            </div>
        </div>

        <!-- MODE 4: Summarizer -->
        <div id="mode-summary" class="mode-content hidden space-y-6">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 backdrop-blur space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Paste Research Text / Article Content</label>
                    <textarea id="summaryPrompt" rows="4" placeholder="Paste research abstract or chapter text here..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200"></textarea>
                </div>
                <button onclick="generateContent('summary')" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-4 rounded-xl shadow-lg">
                    <span>📑 Extract Key Summary & Findings</span>
                </button>
            </div>
        </div>

        <!-- MODE 5: Citation -->
        <div id="mode-citation" class="mode-content hidden space-y-6">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 backdrop-blur space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Citation Style</label>
                        <select id="citationStyle" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option>APA (7th Edition)</option><option>MLA (9th Edition)</option><option>IEEE</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Source Type</label>
                        <select id="citationType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200">
                            <option>Journal Article</option><option>Book</option><option>Website</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Title, Authors, Year, Publisher Details</label>
                    <textarea id="citationPrompt" rows="3" placeholder="e.g. Title: Quantum Computing in 2026..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200"></textarea>
                </div>
                <button onclick="generateContent('citation')" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-semibold py-4 rounded-xl shadow-lg">
                    <span>📌 Format Citation & Reference</span>
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 backdrop-blur space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h2 class="font-semibold text-white">Generated Academic Output & Solutions</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="copyOutput()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">Copy Text</button>
                    <button onclick="printPDF()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg transition">Print / PDF</button>
                </div>
            </div>
            
            <div id="outputContent" class="prose prose-invert max-w-none text-slate-200 text-sm leading-relaxed custom-scrollbar max-h-[600px] overflow-y-auto whitespace-pre-line">
                Your generated content will appear here... Click any generator above!
            </div>

            <!-- LOAD MORE BUTTON (New Feature Added) -->
            <div id="loadMoreContainer" class="hidden pt-2 border-t border-slate-800/60">
                <button onclick="loadMoreContent()" id="loadMoreBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-indigo-300 font-medium py-3 rounded-xl border border-indigo-500/30 transition flex items-center justify-center space-x-2 text-sm">
                    <span>➕ Generate More Questions & Detailed Solutions</span>
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxqowDffgIhL5LtLZyj-mclFsJW_1JU3UD_nz2hiGbQCCqnlwgaUBO2iwBjwtG03H7o/exec";
        let currentMode = 'mode-exam';
        let lastPromptText = '';

        function switchMode(modeId) {
            document.querySelectorAll('.mode-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-slate-300 hover:text-white transition-all";
            });
            
            document.getElementById(modeId).classList.remove('hidden');
            const activeTab = document.getElementById('tab-' + modeId);
            if (activeTab) {
                activeTab.className = "tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 transition-all bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/30";
            }
            currentMode = modeId;
        }

        function generateContent(type, isAppending = false) {
            let prompt = "";
            if (type === 'exam') {
                const cls = document.getElementById('examClass').value;
                const lang = document.getElementById('examLang').value;
                const topic = document.getElementById('examTopic').value || "General Curriculum";
                prompt = `Create a comprehensive, elite academic exam paper with detailed step-by-step solutions for ${cls} on the topic '${topic}'. The entire exam paper and answers must be strictly in ${lang} language. Include MCQs, Short Answers, and Long/Research Analysis Questions with complete derivations.`;
            } else if (type === 'qa') {
                const cls = document.getElementById('qaClass').value;
                const lang = document.getElementById('qaLang').value;
                const depth = document.getElementById('qaDepth').value;
                const userQ = document.getElementById('qaPrompt').value || "Explain core concept";
                prompt = `Provide a 360-degree deep Q&A breakdown and word meaning for '${userQ}' for ${cls} level in ${lang} language with ${depth}.`;
            } else if (type === 'doubt') {
                const lang = document.getElementById('doubtLang').value;
                const style = document.getElementById('doubtStyle').value;
                const doubt = document.getElementById('doubtPrompt').value || "Explain concept";
                prompt = `Solve this doubt: '${doubt}' in ${lang} language using ${style}.`;
            } else if (type === 'summary') {
                const text = document.getElementById('summaryPrompt').value || "Summarize text";
                prompt = `Extract key insights, methodologies, and findings from this text: ${text}`;
            } else if (type === 'citation') {
                const style = document.getElementById('citationStyle').value;
                const srcType = document.getElementById('citationType').value;
                const details = document.getElementById('citationPrompt').value || "Source details";
                prompt = `Generate a perfectly formatted citation in ${style} format for this ${srcType}: ${details}`;
            }

            lastPromptText = prompt;
            const outputDiv = document.getElementById('outputContent');
            const loadMoreContainer = document.getElementById('loadMoreContainer');

            if (!isAppending) {
                outputDiv.innerHTML = "⏳ Generating elite academic content and solutions... Please wait...";
                loadMoreContainer.classList.add('hidden');
            } else {
                document.getElementById('loadMoreBtn').innerText = "⏳ Generating More...";
            }

            const script = document.createElement('script');
            const callbackName = 'cb_' + Math.random().toString(36).substring(2);
            
            window[callbackName] = function(data) {
                if (isAppending) {
                    outputDiv.innerHTML += "\n\n--- ➕ Additional Generated Questions & Solutions ---\n\n" + (data.text || "No response received.");
                    document.getElementById('loadMoreBtn').innerText = "➕ Generate More Questions & Detailed Solutions";
                } else {
                    outputDiv.innerHTML = data.text || "No response received.";
                }
                loadMoreContainer.classList.remove('hidden');
                document.head.removeChild(script);
                delete window[callbackName];
            };

            script.src = `${BACKEND_URL}?prompt=${encodeURIComponent(prompt)}&callback=${callbackName}`;
            document.head.appendChild(script);
        }

        function loadMoreContent() {
            let type = 'exam';
            if (currentMode === 'mode-qa') type = 'qa';
            else if (currentMode === 'mode-doubt') type = 'doubt';
            else if (currentMode === 'mode-summary') type = 'summary';
            else if (currentMode === 'mode-citation') type = 'citation';
            
            generateContent(type, true);
        }

        function copyOutput() {
            const text = document.getElementById('outputContent').innerText;
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard successfully!");
        }

        function printPDF() {
            const element = document.getElementById('outputContent');
            const opt = {
                margin:       10,
                filename:     'shradha-vidya-study-material.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).save();
        }
    </script>
</body>
</html>
