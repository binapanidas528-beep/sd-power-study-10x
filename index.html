<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sd power saudy 10x - India's #1 Student Study Companion</title>
  
  <!-- PDF.js for client-side PDF parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- html2pdf.js for clean PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 2.2rem;
      color: #818cf8;
      margin-bottom: 5px;
    }
    .header p { color: var(--text-muted); font-size: 0.95rem; }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 5px;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }

    /* Screenshot Paste & Drag-Drop Dropzone */
    .dropzone {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #0f172a;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 15px;
    }
    .dropzone.dragover {
      border-color: var(--primary);
      background: #1e1b4b;
    }
    .preview-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    .result-box {
      margin-top: 25px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      display: none;
    }
    .result-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-action {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-pdf { background: var(--accent); color: white; }

    #outputContent {
      white-space: pre-wrap;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ sd power saudy 10x</h1>
    <p>Class 8 to PhD Smart Study & Research Companion</p>
  </div>

  <div class="container">
    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="setMode('exam')">🎓 Exam Generator</button>
      <button class="tab-btn" onclick="setMode('qa')">🔍 Deep Q&A & Word Meaning</button>
      <button class="tab-btn" onclick="setMode('doubt')">⚡ Instant Doubt Solver</button>
      <button class="tab-btn" onclick="setMode('summary')">📄 PDF / Paper Summarizer</button>
    </div>

    <!-- Main Input Form -->
    <form id="studyForm" onsubmit="handleSubmit(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>Class / Level:</label>
          <select id="studentClass">
            <option value="Class 8">Class 8</option>
            <option value="Class 9">Class 9</option>
            <option value="Class 10">Class 10</option>
            <option value="Class 11">Class 11</option>
            <option value="Class 12">Class 12</option>
            <option value="Graduation (UG)">Graduation (UG)</option>
            <option value="Post Graduation (PG)">Post Graduation (PG)</option>
            <option value="PhD / Doctorate">PhD / Doctorate</option>
          </select>
        </div>

        <div class="form-group">
          <label>Language:</label>
          <select id="language">
            <option value="English">English</option>
            <option value="Hindi">Hindi (हिंदी)</option>
            <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
            <option value="Bengali">Bangla (বাংলা)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label id="topicLabel">Subject & Topic Name:</label>
        <input type="text" id="topicInput" placeholder="e.g. Physics - Laws of Motion" required>
      </div>

      <!-- Screenshot Paste & Dropzone Area -->
      <div class="form-group">
        <label>Upload File or Paste Screenshot (Ctrl + V):</label>
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <p>📋 <strong>Click to Upload PDF/Image</strong> or <strong>Press Ctrl + V to Paste Screenshot</strong></p>
          <input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none" onchange="handleFile(this.files[0])">
          <img id="imgPreview" class="preview-img" alt="Screenshot Preview">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">🚀 Process Request</button>
    </form>

    <!-- Result Display Box -->
    <div class="result-box" id="resultBox">
      <div class="result-actions">
        <button class="btn-action btn-pdf" onclick="downloadPDF()">📄 Download Result as PDF</button>
        <button class="btn-action" style="background:#475569; color:white;" onclick="navigator.clipboard.writeText(document.getElementById('outputContent').innerText)">📋 Copy Text</button>
      </div>
      <div id="pdfPrintArea">
        <div id="outputContent">Processing...</div>
      </div>
    </div>
  </div>

  <script>
    // Configuration: Replace with your Cloudflare Worker URL
    const BACKEND_URL = "https://sd-power-study.your-subdomain.workers.dev";
    
    let currentMode = 'exam';
    let uploadedImageData = null;

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      const topicLabel = document.getElementById('topicLabel');
      if (mode === 'qa') topicLabel.innerText = "Enter Question or Difficult Word/Meaning:";
      else if (mode === 'doubt') topicLabel.innerText = "Describe Your Doubt:";
      else topicLabel.innerText = "Subject & Topic Name:";
    }

    // Handle Clipboard Paste (Ctrl + V)
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          handleImageBlob(blob);
          break;
        }
      }
    });

    function handleFile(file) {
      if (!file) return;
      if (file.type.startsWith('image/')) handleImageBlob(file);
    }

    function handleImageBlob(blob) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImageData = e.target.result;
        const preview = document.getElementById('imgPreview');
        preview.src = uploadedImageData;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(blob);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const resultBox = document.getElementById('resultBox');
      const outputContent = document.getElementById('outputContent');
      
      resultBox.style.display = 'block';
      outputContent.innerText = "Generating response... Please wait ⏳";

      const studentClass = document.getElementById('studentClass').value;
      const language = document.getElementById('language').value;
      const topic = document.getElementById('topicInput').value;

      const prompt = `
      STUDENT APP: sd power saudy 10x
      Target Level: ${studentClass}
      Language: ${language}
      Mode: ${currentMode}
      Input Topic/Question: ${topic}
      
      INSTRUCTION: Provide comprehensive, detailed answers strictly in ${language} matching the standards of ${studentClass}. Include expected exam questions, full answers, and word meanings where applicable.
      `;

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, image: uploadedImageData })
        });
        const data = await res.json();
        outputContent.innerText = data.text || data.error || "Execution completed.";
      } catch (err) {
        outputContent.innerText = "Server Error: Backend URL connect nahi ho paya. Make sure Cloudflare worker URL set hai.";
      }
    }

    function downloadPDF() {
      const element = document.getElementById('pdfPrintArea');
      html2pdf().from(element).save('sd_power_study_10x_result.pdf');
    }
  </script>
</body>
</html>
